<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Stream — PHS CDP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"

  />

  <link rel="stylesheet" href="css/main.css" />

      <div class="page">

          <div>

            <p class="page-header__description">Ingestion health by source, as events flow into the PHS CDP. Mock event activity — not live production volume.</p>

        </div>

        <section class="section" style="margin-bottom: 0;">
          <div class="section__body">
            <div class="event-stream-grid" data-stream-grid></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@1.47.0/dist/umd/lucide.js"></script>
  <script type="module">
    import { bootstrapPage } from "./js/main.js";
    import { initEventStream } from "./js/pages/event-stream.js";

    bootstrapPage({
      currentNavId: "event-stream",
      breadcrumb: [{"label": "PHS CDP", "href": "index.html"}, {"label": "Events"}, {"label": "Event Stream"}],
    });
    initEventStream();
